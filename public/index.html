<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sync Engine</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#1c1f24; --muted:#6b7280; --line:#d9dce1;
            --ok:#15803d; --warn:#b45309; --bad:#b91c1c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#14161a; --card:#1d2026; --text:#e8eaed; --muted:#9aa1ac; --line:#323741;
              --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text);
           font:16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
    header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-bottom:12px; }
    h1 { font-size: 18px; margin:0; }
    .pill { display:inline-block; padding:2px 10px; border-radius:999px; border:1px solid var(--line);
            font-size:13px; color:var(--muted); }
    .pill[data-state="online"] { color:var(--ok); border-color:var(--ok); }
    .pill[data-state="syncing"], .pill[data-state="connecting"] { color:var(--warn); border-color:var(--warn); }
    .pill[data-state="disconnected"] { color:var(--bad); border-color:var(--bad); }
    textarea { width:100%; min-height: 55vh; padding:14px; border:1px solid var(--line); border-radius:10px;
               background:var(--card); color:var(--text); font:16px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; resize:vertical; }
    textarea:focus { outline:2px solid var(--ok); outline-offset:1px; }
    footer { margin-top:10px; font-size:13px; color:var(--muted); display:flex; flex-wrap:wrap; gap:6px 18px; }
    code { font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Real-time Collaborative Editor</h1>
      <span id="status" class="pill" data-state="disconnected">disconnected</span>
    </header>
    <textarea id="editor" placeholder="Open this page in two tabs and start typing..." spellcheck="false"></textarea>
    <footer>
      <span>doc: <code id="docId"></code></span>
      <span>you: <code id="site"></code></span>
      <span id="stats"></span>
    </footer>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
